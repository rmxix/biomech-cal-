<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioMech Analyzer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #eef2f6; color: #0f172a; margin: 0; padding: 16px; display: flex; justify-content: center; }
  .card { background: #fff; max-width: 460px; width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; }
  .head { background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff; padding: 22px 20px; text-align: center; }
  .badge { display: inline-block; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 20px; font-size: 11px; text-transform: uppercase; margin-bottom: 6px; }
  .head h1 { font-size: 21px; margin: 0 0 4px; }
  .head p { font-size: 13px; color: #cbd5e1; margin: 0; }
  .body { padding: 20px; }
  .tabs { display: flex; background: #f1f5f9; padding: 4px; border-radius: 12px; margin-bottom: 18px; }
  .tab { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 9px; font-weight: 600; color: #64748b; cursor: pointer; }
  .tab.active { background: #fff; color: #2563eb; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
  input, select { width: 100%; padding: 11px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; background: #f8fafc; box-sizing: border-box; }
  .btn { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .res { margin-top: 18px; padding: 16px; border-radius: 14px; background: #f8fafc; border: 1px solid #e2e8f0; display: none; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .mbox { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; }
  .mlabel { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600; }
  .mval { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .bar-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  .bar { height: 8px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
  .advice { background: #fff; padding: 12px; border-radius: 10px; border-left: 4px solid #2563eb; font-size: 13.5px; line-height: 1.45; margin-top: 12px; }
  .note { margin-top: 10px; font-size: 11px; color: #64748b; text-align: center; font-family: monospace; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="badge">Научно-практический проект</div>
    <h1>BioMech Analyzer</h1>
    <p>Биомеханическая оценка техники и нагрузки в зале</p>
  </div>
  <div class="body">
    <div class="tabs">
      <button type="button" id="t-sq" class="tab active">Приседания</button>
      <button type="button" id="t-pu" class="tab">Подтягивания</button>
    </div>
    <div id="sec-sq">
      <div class="row">
        <div class="group"><label>Ваш вес (кг)</label><input type="number" id="sq-w" placeholder="Ваш вес"></div>
        <div class="group"><label>Ваш рост (см)</label><input type="number" id="sq-h" placeholder="Ваш рост"></div>
      </div>
      <div class="group"><label>Вес штанги (кг)</label><input type="number" id="sq-b" placeholder="0 (если без веса)"></div>
      <div class="group">
        <label>Положение корпуса в нижней точке</label>
        <select id="sq-a">
          <option value="25">Спина почти вертикальна (эталон)</option>
          <option value="40" selected>Умеренный наклон вперед (рабочий стиль)</option>
          <option value="58">Сильный «клевок» вперед (ошибка)</option>
        </select>
      </div>
      <button type="button" id="btn-sq" class="btn">Рассчитать биомеханику приседа</button>
      <div id="res-sq" class="res">
        <div class="metrics">
          <div class="mbox"><div class="mlabel">Момент силы</div><div class="mval" id="sq-m1"></div></div>
          <div class="mbox"><div class="mlabel">Эквивалент</div><div class="mval" id="sq-m2"></div></div>
        </div>
        <div class="bar-head"><span>Риск перегрузки спины</span><span id="sq-st"></span></div>
        <div class="bar"><div class="fill" id="sq-bar"></div></div>
        <div class="advice" id="sq-adv-box"><b>Рекомендация:</b><div id="sq-adv"></div></div>
        <div class="note">Формула рычага: M = F · L · sin(α)</div>
      </div>
    </div>
    <div id="sec-pu" class="hidden">
      <div class="row">
        <div class="group"><label>Ваш вес (кг)</label><input type="number" id="pu-w" placeholder="Ваш вес"></div>
        <div class="group"><label>Ваш рост (см)</label><input type="number" id="pu-h" placeholder="Ваш рост"></div>
      </div>
      <div class="group"><label>Дополнительный вес на поясе (кг)</label><input type="number" id="pu-e" placeholder="0 (если свой вес)"></div>
      <div class="group">
        <label>Темп и техника выполнения</label>
        <select id="pu-s">
          <option value="1.0">Взрывной подъем вверх (~1.0 сек)</option>
          <option value="2.0" selected>Четкий силовой темп без раскачки (~2.0 сек)</option>
          <option value="3.5">Медленный подконтрольный темп (~3.5 сек)</option>
        </select>
      </div>
      <button type="button" id="btn-pu" class="btn">Рассчитать мощность и работу</button>
      <div id="res-pu" class="res">
        <div class="metrics">
          <div class="mbox"><div class="mlabel">Работа за повтор</div><div class="mval" id="pu-m1"></div></div>
          <div class="mbox"><div class="mlabel">Мощность тяги</div><div class="mval" id="pu-m2"></div></div>
        </div>
        <div class="bar-head"><span>Интенсивность</span><span id="pu-st"></span></div>
        <div class="bar"><div class="fill" id="pu-bar"></div></div>
        <div class="advice" id="pu-adv-box"><b>Рекомендация:</b><div id="pu-adv"></div></div>
        <div class="note">Формулы: A = m·g·h | N = A / t</div>
      </div>
    </div>
  </div>
</div>
<script>
document.getElementById("t-sq").onclick = function() {
  this.classList.add("active");
  document.getElementById("t-pu").classList.remove("active");
  document.getElementById("sec-sq").classList.remove("hidden");
  document.getElementById("sec-pu").classList.add("hidden");
};
document.getElementById("t-pu").onclick = function() {
  this.classList.add("active");
  document.getElementById("t-sq").classList.remove("active");
  document.getElementById("sec-pu").classList.remove("hidden");
  document.getElementById("sec-sq").classList.add("hidden");
};
document.getElementById("btn-sq").onclick = function() {
  var bw = parseFloat(document.getElementById("sq-w").value);
  var h = parseFloat(document.getElementById("sq-h").value);
  var bVal = document.getElementById("sq-b").value.trim();
  var bar = bVal === "" ? 0 : parseFloat(bVal);
  var ang = parseFloat(document.getElementById("sq-a").value);
  if (isNaN(bw) || bw <= 0 || isNaN(h) || h <= 0 || isNaN(bar) || bar < 0) { alert("Укажите реальный вес и рост."); return; }
  var torso = (h / 100) * 0.30;
  var lever = torso * Math.sin(ang * Math.PI / 180);
  var torque = (bw * 0.60 + bar) * 9.81 * lever;
  var ratio = lever / (torso * Math.sin(25 * Math.PI / 180));
  var eqBar = Math.max(0, Math.round(((bw * 0.60 + bar) * ratio) - (bw * 0.60)));
  var pct = Math.round((ratio - 1) * 100);
  var st = "Оптимально", col = "#10b981", w = "35%", adv = "Нагрузка на поясницу минимальна. Можно плавно увеличивать веса.";
  if (ang === 40) { st = "Повышенная (+" + pct + "%)"; col = "#f59e0b"; w = "68%"; adv = "Поясница испытывает нагрузку как при идеальном приседе со штангой " + eqBar + " кг. Держите пресс в напряжении."; }
  if (ang === 58) { st = "Критическая (+" + pct + "%)"; col = "#ef4444"; w = "96%"; adv = "Опасный клевок! Нагрузка на спину как при штанге " + eqBar + " кг. Снизьте вес на 15-20% и поработайте над голеностопом."; }
  document.getElementById("sq-m1").textContent = torque.toFixed(0) + " Н·м";
  document.getElementById("sq-m2").textContent = eqBar + " кг";
  document.getElementById("sq-st").textContent = st;
  document.getElementById("sq-st").style.color = col;
  document.getElementById("sq-bar").style.width = w;
  document.getElementById("sq-bar").style.backgroundColor = col;
  document.getElementById("sq-adv-box").style.borderLeftColor = col;
  document.getElementById("sq-adv").textContent = adv;
  document.getElementById("res-sq").style.display = "block";
};
document.getElementById("btn-pu").onclick = function() {
  var bw = parseFloat(document.getElementById("pu-w").value);
  var h = parseFloat(document.getElementById("pu-h").value);
  var eVal = document.getElementById("pu-e").value.trim();
  var ext = eVal === "" ? 0 : parseFloat(eVal);
  var t = parseFloat(document.getElementById("pu-s").value);
  if (isNaN(bw) || bw <= 0 || isNaN(h) || h <= 0 || isNaN(ext) || ext < 0) { alert("Укажите реальный вес и рост."); return; }
  var work = (bw + ext) * 9.81 * ((h / 100) * 0.32);
  var power = work / t;
  var st = "Эталонная техника", col = "#10b981", w = "65%", adv = "Оптимальный баланс работы и времени под нагрузкой. Опускайтесь плавно (~2 сек).";
  if (t === 1.0) { st = "Взрывной режим"; col = "#f59e0b"; w = "90%"; adv = "Максимальная пиковая мощность. Развивает взрывную силу, но следите за отсутствием рывка ногами."; }
  if (t === 3.5) { st = "Статодинамика"; col = "#3b82f6"; w = "45%"; adv = "Максимальный контроль без ударной нагрузки на суставы. Отлично для отработки траектории."; }
  document.getElementById("pu-m1").textContent = work.toFixed(0) + " Дж";
  document.getElementById("pu-m2").textContent = power.toFixed(0) + " Вт";
  document.getElementById("pu-st").textContent = st;
  document.getElementById("pu-st").style.color = col;
  document.getElementById("pu-bar").style.width = w;
  document.getElementById("pu-bar").style.backgroundColor = col;
  document.getElementById("pu-adv-box").style.borderLeftColor = col;
  document.getElementById("pu-adv").textContent = adv;
  document.getElementById("res-pu").style.display = "block";
};
</script>
</body>
</html>
