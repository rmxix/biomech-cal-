<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биомеханический гид</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }
        h1 { font-size: 20px; text-align: center; margin-top: 0; }
        p.subtitle { font-size: 13px; text-align: center; color: #6b7280; margin-bottom: 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; border: 1px solid #d1d5db;
            background: #f9fafb; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .tab-btn.active { background: #2563eb; color: #ffffff; border-color: #2563eb; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        input, select {
            width: 100%; padding: 10px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
        }
        .calc-btn {
            width: 100%; padding: 12px; background: #10b981; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
        .calc-btn:hover { background: #059669; }
        .result-box {
            margin-top: 20px; padding: 16px; border-radius: 10px;
            background: #f8fafc; border-left: 4px solid #2563eb;
            font-size: 14px; line-height: 1.5; display: none;
        }
        .hidden { display: none; }
        .advice-box {
            margin-top: 10px; padding: 10px; border-radius: 8px;
            background: #ffffff; border: 1px solid #e5e7eb;
        }
        .status-safe { color: #059669; font-weight: bold; }
        .status-warn { color: #d97706; font-weight: bold; }
        .status-danger { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Биомеханический гид</h1>
    <p class="subtitle">Оценка безопасности техники и нагрузки в базовых упражнениях</p>

    <div class="tabs">
        <button type="button" id="btn-tab-squat" class="tab-btn active">Приседания</button>
        <button type="button" id="btn-tab-pullup" class="tab-btn">Подтягивания</button>
    </div>

    <div id="squat-section">
        <div class="form-group">
            <label>Ваш вес (кг):</label>
            <input type="number" id="sq-weight" value="61">
        </div>
        <div class="form-group">
            <label>Вес штанги (кг):</label>
            <input type="number" id="sq-barbell" value="50">
        </div>
        <div class="form-group">
            <label>Ваш рост (см):</label>
            <input type="number" id="sq-height" value="175">
        </div>
        <div class="form-group">
            <label>Положение спины в нижней точке:</label>
            <select id="sq-posture">
                <option value="25">Спина почти вертикальна, грудь смотрит вперед (идеально)</option>
                <option value="40" selected>Умеренный наклон корпуса вперед (рабочий вариант)</option>
                <option value="58">Сильный «клевок» вперед, таз уходит назад быстрее плеч (ошибка)</option>
            </select>
        </div>
        <button type="button" id="btn-calc-squat" class="calc-btn">Проверить технику и нагрузку</button>
        <div id="sq-result" class="result-box"></div>
    </div>

    <div id="pullup-section" class="hidden">
        <div class="form-group">
            <label>Ваш вес (кг):</label>
            <input type="number" id="pu-weight" value="61">
        </div>
        <div class="form-group">
            <label>Дополнительный вес на поясе (кг):</label>
            <input type="number" id="pu-extra" value="0">
        </div>
        <div class="form-group">
            <label>Ваш рост (см):</label>
            <input type="number" id="pu-height" value="175">
        </div>
        <div class="form-group">
            <label>Стиль выполнения повторений:</label>
            <select id="pu-style">
                <option value="1.0">Взрывной подъем вверх (~1 сек на повтор)</option>
                <option value="2.0" selected>Четкий силовой темп без раскачки (~2 сек на повтор)</option>
                <option value="3.5">Медленный подконтрольный темп с паузой наверху (~3.5 сек)</option>
            </select>
        </div>
        <button type="button" id="btn-calc-pullup" class="calc-btn">Рассчитать работу и получить совет</button>
        <div id="pu-result" class="result-box"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var tabSquat = document.getElementById("btn-tab-squat");
    var tabPullup = document.getElementById("btn-tab-pullup");
    var secSquat = document.getElementById("squat-section");
    var secPullup = document.getElementById("pullup-section");

    tabSquat.onclick = function() {
        tabSquat.classList.add("active");
        tabPullup.classList.remove("active");
        secSquat.classList.remove("hidden");
        secPullup.classList.add("hidden");
    };

    tabPullup.onclick = function() {
        tabPullup.classList.add("active");
        tabSquat.classList.remove("active");
        secPullup.classList.remove("hidden");
        secSquat.classList.add("hidden");
    };

    document.getElementById("btn-calc-squat").onclick = function() {
        var bw = parseFloat(document.getElementById("sq-weight").value);
        var bar = parseFloat(document.getElementById("sq-barbell").value);
        var h = parseFloat(document.getElementById("sq-height").value);
        var angle = parseFloat(document.getElementById("sq-posture").value);

        if (isNaN(bw) || isNaN(bar) || isNaN(h)) {
            alert("Введите корректные числа.");
            return;
        }

        var torso = (h / 100) * 0.30;
        var rad = angle * (Math.PI / 180);
        var lever = torso * Math.sin(rad);
        var force = (bw * 0.60 + bar) * 9.81;
        var torque = force * lever;

        var idealLever = torso * Math.sin(25 * (Math.PI / 180));
        var ratio = lever / idealLever;
        var eqBar = Math.round(((bw * 0.60 + bar) * ratio) - (bw * 0.60));

        var statusHtml = "";
        var adviceText = "";

        if (angle === 25) {
            statusHtml = "<span class='status-safe'>Отличная биомеханика!</span>";
            adviceText = "Нагрузка распределена оптимально. Поясница защищена, можно плавно прогрессировать в весах.";
        } else if (angle === 40) {
            statusHtml = "<span class='status-warn'>Рабочая техника (повышенная нагрузка на спину).</span>";
            adviceText = "Из-за наклона корпуса нагрузка на поясницу равна идеальному приседу со штангой " + eqBar + " кг. Держите пресс в жестком напряжении.";
        } else {
            statusHtml = "<span class='status-danger'>Высокий риск перегрузки поясницы!</span>";
            adviceText = "При таком клевке нагрузка на поясницу возрастает как при штанге " + eqBar + " кг! Снизьте рабочий вес на 15-20% и поработайте над растяжкой голеностопа.";
        }

        var resBox = document.getElementById("sq-result");
        resBox.style.display = "block";
        resBox.innerHTML = "<b>Статус:</b> " + statusHtml + "<br><b>Момент силы:</b> " + torque.toFixed(0) + " Н·м<div class='advice-box'><b>Совет для зала:</b><br>" + adviceText + "</div>";
    };

    document.getElementById("btn-calc-pullup").onclick = function() {
        var bw = parseFloat(document.getElementById("pu-weight").value);
        var extra = parseFloat(document.getElementById("pu-extra").value);
        var h = parseFloat(document.getElementById("pu-height").value);
        var time = parseFloat(document.getElementById("pu-style").value);

        if (isNaN(bw) || isNaN(extra) || isNaN(h)) {
            alert("Введите корректные числа.");
            return;
        }

        var totalMass = bw + extra;
        var dist = (h / 100) * 0.32;
        var force = totalMass * 9.81;
        var work = force * dist;
        var power = work / time;

        var statusHtml = "";
        var adviceText = "";

        if (time === 1.0) {
            statusHtml = "<span class='status-warn'>Взрывной силовой стиль</span>";
            adviceText = "Максимальная пиковая мощность. Следите, чтобы подъем шел за счет сведения лопаток, а не за счет рывка ногами.";
        } else if (time === 2.0) {
            statusHtml = "<span class='status-safe'>Эталонная техника</span>";
            adviceText = "Оптимальный баланс мощности и контроля. Опускайтесь плавно, чтобы защитить локтевые и плечевые суставы.";
        } else {
            statusHtml = "<span class='status-safe'>Максимальный контроль</span>";
            adviceText = "Высокое время под нагрузкой. Отлично укрепляет связки и прорабатывает мышцы спины без большого доп. веса.";
        }

        var resBox = document.getElementById("pu-result");
        resBox.style.display = "block";
        resBox.innerHTML = "<b>Стиль:</b> " + statusHtml + "<br><b>Работа за повтор:</b> " + work.toFixed(0) + " Дж (Мощность: " + power.toFixed(0) + " Вт)<div class='advice-box'><b>Совет для зала:</b><br>" + adviceText + "</div>";
    };
});
</script>

</body>
</html>
